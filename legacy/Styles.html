/* Branding: dùng logo chính thức của SMEE. */
.smee-brand-image{display:inline-flex;align-items:center;justify-content:center;min-width:56px;max-width:145px;height:54px;padding:7px 10px;border-radius:11px;background:#fff;color:#1f4c88;font-weight:800;flex-shrink:0;overflow:hidden;letter-spacing:0}
.smee-brand-image img{display:block;max-width:124px;max-height:43px;width:auto;height:auto;object-fit:contain}
.sidebar .smee-brand-image{height:45px;max-width:105px;min-width:47px;padding:5px 7px}
.sidebar .smee-brand-image img{max-width:90px;max-height:38px}
.passcode-control{position:relative;width:100%}
.passcode-control input{padding-right:56px!important;width:100%}
.eye-toggle{position:absolute;right:9px;top:50%;transform:translateY(-50%);width:40px;height:40px;border:0;border-radius:9px;background:transparent;color:#73849e;display:grid;place-items:center}
.eye-toggle:hover,.eye-toggle:focus-visible{background:#eaf1fd;color:#2357aa}
.eye-toggle .eye-off{display:block}
.eye-toggle.is-visible .eye-off{display:none}
.eye-toggle.is-visible .eye-open{display:block}
.login-note.is-info{color:#2a61c2}
.passcode-control .eye-toggle{display:flex;align-items:center;justify-content:center;z-index:2}
.passcode-control .eye-toggle:focus-visible{outline:2px solid #376fd5;outline-offset:2px}
.demo-mode-tag{font-size:9px;font-weight:800;letter-spacing:.05em;color:#765219;background:#fff2d8;border:1px solid #f5deb2;border-radius:16px;padding:7px 10px;white-space:nowrap}
.boot-screen{min-height:58vh;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px;text-align:center;color:#657994}
.boot-spinner{width:32px;height:32px;border:3px solid #dae6f7;border-top-color:#386fd0;border-radius:50%;animation:boot-spin .85s linear infinite}
@keyframes boot-spin{to{transform:rotate(360deg)}}
.boot-screen p{font-size:13px;margin:0}
.app-failure{margin:30px auto;max-width:760px;padding:28px;background:white;border:1px solid #f0cfd2;border-radius:14px;box-shadow:0 10px 35px #1a3b6a10;color:#213f62}
.app-failure h2{font-size:19px;margin:0 0 12px}
.app-failure p{line-height:1.8;font-size:12px;color:#5b6c86;overflow-wrap:anywhere}
.app-failure .btn{margin-top:9px}
@media(max-width:760px){.demo-mode-tag{font-size:8px;padding:6px 8px}.sidebar .smee-brand-image{height:42px}}

/* SMEE 2.0 — biểu tượng trạng thái nhìn thấy, không nhầm trạng thái ẩn/hiện. */
.passcode-control .eye-toggle .eye-open{display:none!important}
.passcode-control .eye-toggle .eye-off{display:block!important}
.passcode-control .eye-toggle.is-visible .eye-open{display:block!important}
.passcode-control .eye-toggle.is-visible .eye-off{display:none!important}
.passcode-control .eye-toggle{right:8px;top:50%;transform:translateY(-50%);cursor:pointer;touch-action:manipulation}
.password-hint{font-size:10px;line-height:1.4;color:#7386a1;margin:7px 0 10px;min-height:16px}
.login-check{width:100%;border:none;background:transparent;padding:12px 8px 6px;color:#386ac0;font-size:11px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.login-check:hover{color:#1d4f9d}

/* SMEE 7.2 — nút thao tác rõ hơn, tooltip, form công việc chia khối, modal cuộn trong. */
.row-actions{gap:8px;align-items:center}
.icon-btn{position:relative;width:36px;height:36px;min-width:36px;padding:0;display:inline-flex;align-items:center;justify-content:center;border-radius:9px;color:#2f5fae}
.icon-btn svg{width:18px;height:18px;display:block}
.icon-btn.icon-danger{color:#d0464f;background:#fff5f5;border-color:#f6d3d6}
.icon-btn.icon-danger:hover{background:#ffe9ea}
.icon-btn:focus-visible,.has-tip:focus-visible{outline:2px solid #376fd5;outline-offset:2px}
.has-tip{position:relative}
.icon-btn[data-tip]::after,.has-tip[data-tip]::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 8px);left:50%;transform:translate(-50%,4px);background:#142e56;color:#fff;font-size:10.5px;font-weight:600;line-height:1.4;white-space:nowrap;padding:6px 9px;border-radius:7px;box-shadow:0 6px 18px #0e254833;opacity:0;pointer-events:none;transition:opacity .12s,transform .12s;z-index:20}
.icon-btn[data-tip]:hover::after,.icon-btn[data-tip]:focus-visible::after,.has-tip[data-tip]:hover::after,.has-tip[data-tip]:focus-visible::after{opacity:1;transform:translate(-50%,0)}
.row-actions>:last-child[data-tip]::after{left:auto;right:0;transform:translateY(4px)}
.row-actions>:last-child[data-tip]:hover::after,.row-actions>:last-child[data-tip]:focus-visible::after{transform:none}
.people-filter{margin-bottom:17px}
.timeline-toolbar .control{min-width:150px}
#editForm{display:flex;flex-direction:column;flex:1 1 auto;min-height:0}
.modal{max-height:90vh}
.modal-head,.modal-footer{flex-shrink:0}
.modal-body{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain}
.form-section{border:1px solid #e8eef7;border-radius:12px;padding:14px 16px 16px;margin:0 0 14px;min-width:0}
.form-section:last-child{margin-bottom:0}
.form-section legend{padding:0 6px;font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#4571be}
.form-help.span2{grid-column:span 2;margin-top:-6px}
.float-tip{position:fixed;left:0;top:0;z-index:80;max-width:min(340px,calc(100vw - 20px));background:#102748;color:#e9f0fb;border-radius:10px;padding:11px 13px;box-shadow:0 14px 34px #07193a55;font-size:11px;line-height:1.5;pointer-events:none;opacity:0;transition:opacity .1s}
.float-tip.show{opacity:1}
.float-tip .ft-title{font-weight:800;font-size:12px;color:#fff;overflow-wrap:anywhere}
.float-tip .ft-sub{color:#9fb8de;font-size:10.5px;margin-top:2px;overflow-wrap:anywhere}
.float-tip dl{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin:8px 0 0}
.float-tip dt{color:#8fa8cf;white-space:nowrap}
.float-tip dd{margin:0;overflow-wrap:anywhere;white-space:pre-line}
.float-tip .ft-warn{margin-top:8px;padding:6px 8px;border-radius:7px;background:#5a1f2a;color:#ffd5da;font-weight:600}
.bar-row[data-tipx],.delay-bar-item[data-tipx]{cursor:default}
.kpi-link,.alert-link{cursor:pointer;transition:border-color .15s,box-shadow .15s,transform .15s}
.kpi-link:hover,.kpi-link:focus-visible{border-color:#9dbcf2;box-shadow:0 10px 28px #2b69dd1f;transform:translateY(-2px);outline:0}
.kpi-link::after{content:'Xem chi tiết →';display:block;margin-top:8px;font-size:9.5px;font-weight:700;color:#2b69dd;opacity:.75}
.kpi-link:hover::after{opacity:1}
.alert-link:hover,.alert-link:focus-visible{border-color:#e9b3aa;background:#fff3f1;outline:0}
.alert-item.blue.alert-link:hover,.alert-item.blue.alert-link:focus-visible{border-color:#b9cdf3;background:#eef4ff}
.chip-row{display:flex;flex-wrap:wrap;align-items:center;gap:7px;margin:-6px 0 16px}
.chip-row-label{font-size:10px;color:#8191a7;font-weight:700}
.filter-chip{display:inline-flex;align-items:center;gap:6px;border:1px solid #c9d9f5;background:#eef4ff;color:#2457b4;border-radius:16px;padding:5px 10px;font-size:10px;font-weight:700}
.filter-chip span{font-size:13px;line-height:1}
.filter-chip:hover{background:#dfeafe}
.day-chip{border:1px solid #f1c4c0;background:#fff6f5;color:#b7433c;border-radius:7px;padding:5px 9px;font-size:10px;font-weight:700}
.day-chip.active{background:#e5675c;border-color:#e5675c;color:#fff}
/* BUILD 7.2 — Menu: icon SVG đồng bộ, chữ đậm, tương phản đạt WCAG AA. */
.sidebar-label{color:#475569;font-size:10.5px;letter-spacing:.12em}
.nav-list{gap:3px}
.nav-item{position:relative;color:#1f2937;font-size:14px;font-weight:600;padding:10px 12px 10px 14px;gap:12px;border-radius:10px}
.nav-item .nav-icon{flex-shrink:0;width:20px;height:20px;color:currentColor}
.nav-item .nav-text{font-size:inherit;width:auto;text-align:left;color:inherit;line-height:1.35}
.nav-item:hover{background:#f1f5f9;color:#0f172a}
.nav-item:focus-visible{outline:2px solid #2563eb;outline-offset:1px}
.nav-item.active{background:#e8f0ff;color:#1d4ed8}
.nav-item.active::before{content:'';position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:#1d4ed8}
.product-brand small{color:#475569;font-size:9px;letter-spacing:.14em}
.product-brand b{color:#14234a}

/* Báo cáo theo công việc */
.report-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.report-head .control{font-weight:600;min-width:220px}
.report-task>summary{align-items:flex-start}
.report-task .delay-task-name{flex:0 1 260px;display:flex;flex-direction:column;position:relative;padding-left:12px}
.prio-dot{position:absolute;left:0;top:3px;width:5px;height:15px;border-radius:3px;background:var(--pr)}
.report-metrics{flex:1;display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px 14px;font-size:10.5px;color:#334155}
.report-metrics>span{display:block;line-height:1.5}
.report-metrics small{display:block;color:#64748b;font-size:9px;font-weight:700;letter-spacing:.03em;text-transform:uppercase}
.report-metrics em{font-style:normal;font-weight:800}
.report-metrics em.neg{color:#b91c1c}
.report-metrics em.pos{color:#15803d}
.report-detail{padding:12px 14px 14px;border-top:1px solid #edf1f7}
@media(max-width:760px){.report-head{display:block}.report-head .control{width:100%;margin-top:8px}.report-task .delay-task-name{flex-basis:100%}}
/* Ưu tiên trên Lịch giờ làm */
.timeline-bar.pr-urgent,.timeline-bar.pr-high,.timeline-bar.pr-medium,.timeline-bar.pr-low{border-left:5px solid var(--pr);padding-left:5px}
.pr-urgent{--pr:#b91c1c}.pr-high{--pr:#c2410c}.pr-medium{--pr:#ca8a04}.pr-low{--pr:#64748b}
.prio-badge{flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;min-width:16px;height:16px;padding:0 3px;margin-right:5px;border-radius:4px;background:#fff;color:var(--pr);font-size:10px;font-weight:900;line-height:1}
.timeline-bar.short .prio-badge{margin-right:2px}
.timeline-bar.tiny .prio-badge{display:none}
.prio-legend{display:flex;flex-wrap:wrap;align-items:center;gap:12px;font-size:10px;color:#475569;margin:-6px 0 14px}
.prio-legend b{color:#334155}
.prio-legend .pl{display:inline-flex;align-items:center;justify-content:center;width:18px;height:14px;margin-right:4px;border-radius:3px;background:#5289e4;border-left:4px solid var(--pr);color:#fff;font-style:normal;font-weight:900;font-size:9px;vertical-align:middle}
.prio-legend .control{min-height:32px;margin-left:auto}
.legend-lunch{background:repeating-linear-gradient(135deg,rgba(100,116,139,.35) 0 3px,rgba(100,116,139,.1) 3px 6px)}
/* Nghỉ trưa */
.lunch-band{position:absolute;top:0;bottom:0;z-index:2;pointer-events:none;background:repeating-linear-gradient(135deg,rgba(100,116,139,.16) 0 5px,rgba(100,116,139,.05) 5px 10px);border-left:1px dashed #94a3b8;border-right:1px dashed #94a3b8}
.lunch-band.head{display:flex;align-items:flex-end;justify-content:center;font-style:normal;font-size:9px;font-weight:700;color:#475569;padding-bottom:3px;white-space:nowrap}
.lunch-note{color:#2457b4}
.lunch-note.warn{color:#b45309;font-weight:700}

/* BUILD 7.2 — deadline, quá hạn, giờ thực tế / dự kiến, vướng mắc đang chờ */
.dl{display:inline-block;font-weight:700;color:#334155;padding:3px 7px;border-radius:6px}
.dl-soon{background:#fef3c7;color:#92400e;box-shadow:inset 0 0 0 1px #fcd34d}
.dl-late{background:#fee2e2;color:#b91c1c;box-shadow:inset 0 0 0 1px #fca5a5}
.dl-note{display:block;font-size:9px;margin-top:3px;color:#64748b}
.dl-note.soon{color:#92400e;font-weight:700}
.dl-note.late{color:#b91c1c;font-weight:700}
.pill.status-late{background:#fee2e2;color:#b91c1c}
.hours-cell{min-width:118px;font-size:10px;color:#334155}
.hours-cell b{font-size:11px;color:#1f3557}
.hours-cell small{display:block;margin-top:3px;color:#64748b;font-size:9px}
.mini-bar{height:5px;border-radius:4px;background:#e8eef6;overflow:hidden;margin-top:5px}
.mini-bar span{display:block;height:100%;background:#36ad91;border-radius:4px}
.hours-cell.warn .mini-bar span{background:#d97706}
.hours-cell.warn small{color:#92400e;font-weight:700}
.hours-cell.over .mini-bar span{background:#dc2626}
.hours-cell.over small,.hours-cell.over b{color:#b91c1c;font-weight:800}
.icon-btn.icon-alert{color:#fff;background:#dc2626;border-color:#b91c1c;box-shadow:0 0 0 3px #fecaca}
.icon-btn.icon-alert:hover{background:#b91c1c}

/* BUILD 7.2 — ô Chờ/vướng bấm được, tô nổi bật vướng mắc của việc đang xem */
.cell-link{border:0;background:transparent;padding:0;cursor:pointer;position:relative;text-decoration:underline;text-decoration-color:transparent;text-underline-offset:3px}
.cell-link:hover .pill,.cell-link:focus-visible .pill{box-shadow:0 0 0 2px #6d28d9;text-decoration:underline}
.cell-link.muted-link{color:#64748b;font-weight:700;padding:2px 8px;border-radius:6px}
.cell-link.muted-link:hover{background:#f1f5f9;color:#1f2937}
.data-table tbody tr.row-focus td{background:#f5f3ff;border-top:2px solid #6d28d9;border-bottom:2px solid #6d28d9}
.data-table tr.row-focus td:first-child{border-left:2px solid #6d28d9}
.data-table tr.row-focus td:last-child{border-right:2px solid #6d28d9}
.data-table tr.row-focus td{animation:focus-blink 1.1s ease-in-out 2}
@keyframes focus-blink{50%{background:#ddd6fe}}

/* BUILD 7.2 — nhóm theo dự án, nút duyệt màu phân biệt, cột nhận xét */
.task-table .group-row td{background:#eef3fb;border-top:1px solid #d6e2f3;border-bottom:1px solid #d6e2f3;padding:10px 14px;cursor:pointer;white-space:normal}
.task-table .group-row:hover td{background:#e3ecf9}
.task-table .group-row b{font-size:12px;color:#14234a;margin-right:10px}
.group-caret{display:inline-block;width:16px;color:#2457b4;font-size:12px;transition:transform .15s}
.group-row.closed .group-caret{transform:rotate(-90deg)}
.group-meta{font-size:10px;color:#475569}
.group-meta em{font-style:normal;color:#b91c1c;font-weight:800}
.btn-act{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border-radius:9px;border:1px solid transparent;font-size:11px;font-weight:700;white-space:nowrap;text-decoration:none;cursor:pointer;position:relative}
.btn-act svg{flex-shrink:0}
.act-approve{background:#15803d;color:#fff}.act-approve:hover{background:#166534}
.act-reject{background:#fff7ed;color:#9a3412;border-color:#fdba74}.act-reject:hover{background:#ffedd5}
.act-submit{background:#1d4ed8;color:#fff}.act-submit:hover{background:#1e40af}
.act-open{background:#fff;color:#1f2937;border-color:#cbd5e1}.act-open:hover{background:#f1f5f9}
.btn-act:focus-visible{outline:2px solid #1d4ed8;outline-offset:2px}
.approval-actions{flex-wrap:wrap;gap:8px}
.col-comment{max-width:220px;white-space:normal}
.comment-cell{max-width:220px;cursor:default}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:#334155;font-size:10.5px;line-height:1.5;white-space:normal}
.comment-cell small{display:block;margin-top:3px;color:#64748b;font-size:9px}
.task-table td{padding:11px 12px}
.task-table th{padding:12px}

/* BUILD 7.2 — Tiến độ dài hạn (Gantt) */
.seg{display:inline-flex;gap:4px}
.g-range{font-size:12px;color:#14234a;margin:0 6px}
.g-scroll{overflow-x:auto}
.g-box{min-width:940px}
.g-row{display:grid;grid-template-columns:270px 1fr;border-bottom:1px solid #edf1f7;min-height:46px}
.g-left{position:sticky;left:0;z-index:5;background:#fff;padding:8px 12px 8px 22px;border-right:1px solid #e6ebf2;display:flex;flex-direction:column;justify-content:center;min-width:0}
.g-left b{font-size:11px;color:#1f3557;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.g-left small{font-size:9.5px;color:#64748b;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.g-left .prio-dot{left:8px;top:50%;transform:translateY(-50%);height:22px}
.g-left{position:sticky}
.g-head{min-height:36px;background:#fbfcff}
.g-head .g-left{background:#fbfcff;font-size:11px;font-weight:700;color:#475569;letter-spacing:0;padding-left:12px}
.g-track{position:relative;overflow:hidden;background-image:linear-gradient(to right,#f1f4f9 1px,transparent 1px)}
.g-axis{overflow:visible}
.g-tick{position:absolute;top:11px;font-size:9px;color:#64748b;white-space:nowrap;padding-left:3px;border-left:1px solid #dfe6f1;height:25px;top:5px;line-height:25px}
.g-tick.month{color:#14234a;font-weight:800;border-left-color:#94a3b8}
.g-weekend{position:absolute;top:0;bottom:0;background:#f4f6fa}
.g-today{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:#e5675c;z-index:3}
.g-group{background:#eef3fb;cursor:pointer}
.g-group .g-left{background:#eef3fb;padding-left:10px}
.g-group:hover .g-left,.g-group:hover{background:#e3ecf9}
.g-group.closed .group-caret{transform:rotate(-90deg)}
.g-group .g-left b{font-size:12px;color:#14234a}
.g-proj{position:absolute;top:50%;height:8px;margin-top:-4px;border-radius:4px;background:#475569;opacity:.55}
.g-bar{position:absolute;top:9px;height:22px;border-radius:6px;border:0;padding:0;cursor:pointer;min-width:4px;opacity:.28}
.g-bar:hover{opacity:.42}
.g-bar.g-active{background:#2563eb}.g-bar.g-done{background:#16a34a}.g-bar.g-late{background:#dc2626}.g-bar.g-idle{background:#94a3b8}
.g-over{position:absolute;top:9px;height:22px;background:repeating-linear-gradient(135deg,#dc2626 0 4px,#f87171 4px 8px);border-radius:0 6px 6px 0;opacity:.8}
.g-dot{position:absolute;top:12px;height:16px;border:0;padding:0;border-radius:3px;background:#1d4ed8;opacity:var(--a);cursor:pointer;min-width:5px;transform:scaleX(.8)}
.g-dot:hover{outline:2px solid #0f172a;opacity:1}
.g-wait{position:absolute;top:5px;height:3px;border-radius:2px;background:#ea8c00}
.g-label{position:absolute;top:32px;font-size:9px;font-weight:700;color:#334155;white-space:nowrap;padding-left:2px;pointer-events:none}
.g-out{position:absolute;top:15px;left:8px;font-size:9.5px;color:#94a3b8}
.g-row:not(.g-head):not(.g-group){min-height:48px}
.lg{display:inline-block;width:14px;height:9px;border-radius:3px;margin-right:4px;vertical-align:middle;opacity:.6}
.lg.g-active{background:#2563eb}.lg.g-done{background:#16a34a}.lg.g-late{background:#dc2626}.lg.g-idle{background:#94a3b8}
.lg.g-dotlg{background:#1d4ed8;opacity:1;width:8px}.lg.g-waitlg{background:#ea8c00;height:3px;opacity:1}
@media(max-width:760px){.g-row{grid-template-columns:170px 1fr}}

/* Tìm dự án */
.search-box{position:relative;flex:1;min-width:220px;max-width:380px}
.search-box .search{width:100%;max-width:none;padding-right:32px}
.search-clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;font-size:17px;line-height:1;color:#64748b;padding:4px 6px;border-radius:6px}
.search-clear:hover{background:#eef2f7;color:#1f2937}

/* BUILD 7.2 — Phân tích chậm trễ theo dự án → công việc. */
.delay-link{cursor:pointer;border-radius:10px;padding:8px 10px;margin:-8px -10px;transition:background .15s}
.delay-link:hover,.delay-link:focus-visible{background:#eef4ff;outline:0}
.delay-arrow{font-style:normal;font-weight:800;color:#2b69dd;margin-left:6px;font-size:13px}
.delay-project{border:1px solid #e6ebf2;border-radius:11px;margin-bottom:10px;background:#fff}
.delay-project>summary,.delay-task>summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 14px}
.delay-project>summary::-webkit-details-marker,.delay-task>summary::-webkit-details-marker{display:none}
.delay-project>summary::before,.delay-task>summary::before{content:'›';font-weight:800;color:#5b7296;transition:transform .15s;margin-right:4px}
.delay-project[open]>summary::before,.delay-task[open]>summary::before{transform:rotate(90deg)}
.delay-project>summary>b{flex:1;color:#1f3557;font-size:12px}
.delay-project[open]>summary{border-bottom:1px solid #eef2f7}

.delay-task-stats{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:10px;color:#64748b}

.delay-task .table-wrap{border-top:1px solid #edf1f7}
.data-table.compact td,.data-table.compact th{padding:9px 12px}
.data-table.compact{min-width:960px}

/* BUILD 7.2 — Timeline 08:00–18:00, xếp làn, OT. */
.timeline-row{min-height:0}
.timeline-row .timeline-track{min-height:72px;background-color:#fff;background-image:linear-gradient(to right,#dfe6f1 1px,transparent 1px),linear-gradient(to right,#f1f4f9 1px,transparent 1px);background-size:10% 100%,5% 100%;background-position:0 0}
.timeline-emp-col{position:sticky;left:0;z-index:4;background:#fff}
.timeline-head .timeline-emp-col{background:#fbfcff}
.timeline-row .timeline-emp-col{justify-content:flex-start!important;border-right:1px solid #edf1f7}
.timeline-hours .hour-label:first-child{transform:none}
.timeline-hours .hour-label:last-child{transform:translateX(-100%)}
.timeline-bar{height:22px;line-height:22px;padding:0 6px;min-width:6px;display:flex;align-items:center}
.timeline-bar span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.timeline-bar.tiny{padding:0 2px}
.timeline-bar.tiny span{display:none}
.timeline-bar.clip-l{border-top-left-radius:0;border-bottom-left-radius:0;padding-left:9px}
.timeline-bar.clip-r{border-top-right-radius:0;border-bottom-right-radius:0;padding-right:9px}
.timeline-bar.clip-l::before,.timeline-bar.clip-r::after{content:'';position:absolute;top:0;bottom:0;width:5px;background:linear-gradient(135deg,#fff 25%,transparent 25%) 0 0/5px 5px,linear-gradient(45deg,#fff 25%,transparent 25%) 0 0/5px 5px;opacity:.9}
.timeline-bar.clip-l::before{left:0}
.timeline-bar.clip-r::after{right:0;transform:scaleX(-1)}
.timeline-bar.waiting{top:auto}
.band-label{position:absolute;left:3px;font-size:8px;font-weight:800;letter-spacing:.06em;color:#a3b1c5;background:#ffffffd9;padding:1px 3px;border-radius:3px;z-index:1;pointer-events:none}
.now-line{position:absolute;top:0;bottom:0;width:2px;background:#e5675c;z-index:3;pointer-events:none}
.now-line::before{content:'';position:absolute;top:-3px;left:-3px;width:8px;height:8px;border-radius:50%;background:#e5675c}
.timeline-emp-col small{line-height:1.5}
.ot-text{color:#b45f12;font-weight:800}
.ot-list{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.ot-chip{font-size:9px;font-weight:700;border-radius:5px;padding:2px 6px;background:#fff1e0;color:#a5570f;border:1px dashed #e6a35c;cursor:default;white-space:nowrap}
.ot-chip.actual{background:#fdeee0}
.legend-ot{border:1px dashed #e6a35c;background:#fff1e0}
.timeline-row.row-conflict .timeline-emp-col{background:#fff6f5}
.timeline-row.row-conflict{background:#fff6f5;box-shadow:inset 3px 0 0 #e5675c}
@media(max-width:760px){.form-help.span2{grid-column:span 1}.form-section{padding:12px}.icon-btn[data-tip]::after,.has-tip[data-tip]::after{display:none}.people-filter .control{flex:1}}

/* BUILD 7.2 — bảng màu ưu tiên dùng chung (đặt cuối file để ghi đè các quy tắc cũ).
   Màu vạch/thanh: Rất gấp #dc2626, Gấp #ea580c, Trung bình #ca8a04, Thấp #94a3b8.
   Chip có chữ dùng biến thể đủ tương phản AA: chữ trắng trên #dc2626 (4,8:1) và #c2410c (5,2:1); chữ #1f2937 trên #ca8a04 (5,0:1) và #94a3b8 (5,7:1).
   Dải Chờ / vướng đổi sang nâu sọc để không lẫn với cam của "Gấp". */
:root{--pr-urgent:#dc2626;--pr-high:#ea580c;--pr-medium:#ca8a04;--pr-low:#94a3b8;--pr-high-strong:#c2410c;--pr-ink:#1f2937;--wait:#7c5a3a;--wait2:#9a7552}
.pr-urgent{--pr:var(--pr-urgent)}.pr-high{--pr:var(--pr-high)}.pr-medium{--pr:var(--pr-medium)}.pr-low{--pr:var(--pr-low)}
.timeline-bar.pr-urgent,.timeline-bar.pr-high,.timeline-bar.pr-medium,.timeline-bar.pr-low{border-left:6px solid var(--pr);padding-left:5px}
.prio-badge{background:var(--pr);color:#fff;min-width:17px;height:16px;border-radius:4px;font-size:10px;font-weight:900;margin-right:5px;box-shadow:0 0 0 1px #ffffffb3}
.pr-high .prio-badge{background:var(--pr-high-strong)}
.prio-mini{flex-shrink:0;width:9px;height:9px;border-radius:50%;background:var(--pr);margin-right:5px;box-shadow:0 0 0 2px #ffffffd9}
.timeline-bar.tiny .prio-mini{display:none}
.timeline-bar.waiting{background:repeating-linear-gradient(135deg,var(--wait) 0 6px,var(--wait2) 6px 12px);border:1px solid #5c4128;color:#fff}
.timeline-bar.waiting:hover{filter:brightness(1.1)}
.legend-wait{background:repeating-linear-gradient(135deg,var(--wait) 0 3px,var(--wait2) 3px 6px)}
.timeline-toolbar .legend{flex-wrap:wrap;align-items:center;row-gap:6px}
.legend-sep{width:1px;height:16px;background:#cbd5e1;margin:0 2px}
.prio-chip{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:10px;font-size:10px;font-weight:800;line-height:1}
.pc-urgent{background:var(--pr-urgent);color:#fff}.pc-high{background:var(--pr-high-strong);color:#fff}.pc-medium{background:var(--pr-medium);color:var(--pr-ink)}.pc-low{background:var(--pr-low);color:var(--pr-ink)}
.timeline-toolbar .legend .control{min-height:32px}
/* Huy hiệu cột Ưu tiên (Công việc, Báo cáo) dùng cùng bảng màu */
.pill.prio-urgent{background:var(--pr-urgent);color:#fff}
.pill.prio-high{background:var(--pr-high-strong);color:#fff}
.pill.prio-medium{background:var(--pr-medium);color:var(--pr-ink)}
.pill.prio-low{background:var(--pr-low);color:var(--pr-ink)}
/* Vướng mắc trên Gantt và biểu đồ chậm trễ: nâu cho đồng bộ */
.g-wait{background:var(--wait);height:4px}
.lg.g-waitlg{background:var(--wait);height:4px}
.bar-wait{background:linear-gradient(90deg,var(--wait),var(--wait2))}

/* BUILD 7.2 — sidebar chỉ giữ logo SMEE, bỏ thẻ "Minh bạch tiến độ" */
.sidebar-head{padding:0 8px 34px;display:flex;align-items:center;justify-content:space-between}
.sidebar .product-brand{flex:1;justify-content:flex-start}
.sidebar .smee-brand-image{height:58px;max-width:180px;min-width:0;padding:6px 8px;background:transparent}
.sidebar .smee-brand-image img{max-width:164px;max-height:46px}

/* BUILD 7.2 — ưu tiên trên Tiến độ dài hạn */
.g-name{display:flex;align-items:center;gap:6px;min-width:0}
.g-name b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.g-name .prio-chip{flex-shrink:0;height:17px;padding:0 6px;font-size:9px}
.g-left .prio-dot{width:6px}
.g-prio{position:absolute;top:9px;height:22px;display:flex;align-items:center;z-index:2;pointer-events:none;border-left:6px solid var(--pr);padding-left:3px}
.g-prio.cut{border-left-style:dashed}
.g-prio .prio-badge{margin:0;box-shadow:0 0 0 1px #fff}
.g-prio .prio-mini{margin:0}

/* BUILD 7.2 — Nhân sự: thẻ thống kê đạt được / khó khăn */
.ps-grid{grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
.ps-card{cursor:pointer;transition:box-shadow .15s,transform .15s;display:flex;flex-direction:column;gap:10px}
.ps-card:hover,.ps-card:focus-visible{box-shadow:0 10px 28px #2b69dd1f;transform:translateY(-2px);outline:0}
.ps-head{display:flex;gap:11px;align-items:center}
.ps-head .person-avatar{margin:0;flex-shrink:0}
.ps-head h3{margin:0 0 3px}
.ps-head p{margin:0;height:auto;font-size:10px;color:#64748b}
.ps-sec{border-radius:10px;padding:9px 11px}
.ps-sec.good{background:#f0fdf4;border:1px solid #bbf7d0}
.ps-sec.bad{background:#fff7ed;border:1px solid #fed7aa}
.ps-title{font-size:9.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;margin-bottom:5px}
.ps-sec.good .ps-title{color:#15803d}.ps-sec.bad .ps-title{color:#c2410c}
.ps-line{display:grid;grid-template-columns:1fr auto;column-gap:8px;font-size:10.5px;color:#334155;padding:3px 0}
.ps-line b{font-size:12px;color:#14234a}
.ps-line small{grid-column:1/-1;font-size:9px;color:#64748b}
.ps-line.hot b{color:#b91c1c}.ps-line.warm b{color:#c2410c}
.ps-bar{margin:2px 0 4px}
.ps-bar.good span{background:#16a34a}.ps-bar.warn span{background:#d97706}.ps-bar.bad span{background:#dc2626}
.week-chart{display:flex;gap:8px;align-items:flex-end;height:150px;overflow-x:auto;padding-bottom:4px}
.wk{flex:1;min-width:32px;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%}
.wk-bars{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center;gap:3px;border-bottom:1px solid #e2e8f0}
.wk-bars i{display:block;width:40%;border-radius:4px 4px 0 0;min-height:1px}
.wk small{font-size:9px;color:#64748b}

/* BUILD 7.2 — Nhập từ Google Sheet */
.gs-step{margin-bottom:14px}
.gs-step>label{display:block;font-size:10px;font-weight:700;color:#4e6280;margin-bottom:6px}
.gs-row{display:flex;gap:8px;flex-wrap:wrap}
.gs-row .control{flex:1;min-width:220px}
.gs-error{color:#b91c1c;font-size:11px;line-height:1.6;margin:-4px 0 10px}
.gs-error:empty{display:none}
.gs-summary{font-size:11px;padding:9px 11px;border-radius:8px;margin-bottom:8px}
.gs-summary.ok{background:#f0fdf4;color:#166534}.gs-summary.bad{background:#fef2f2;color:#b91c1c}
.gs-table{max-height:260px;border:1px solid #e6ebf2;border-radius:8px;margin-bottom:12px}
.gs-history{display:grid;gap:6px}
.gs-hist{text-align:left;border:1px solid #e2e8f0;background:#f8fafc;border-radius:8px;padding:8px 10px;cursor:pointer}
.gs-hist:hover{background:#eef4ff;border-color:#bfd3f5}
.gs-hist b{display:block;font-size:11px;color:#1f3557}.gs-hist small{font-size:9.5px;color:#64748b}

/* BUILD 7.2 — nút thao tác gọn, popup nhận xét */
.btn-act{min-height:30px;padding:0 9px;font-size:12px;font-weight:600;border-radius:8px;gap:5px}
.btn-act svg{width:14px;height:14px}
.task-table .icon-btn,.approval-actions .icon-btn{width:32px;height:32px;min-width:32px}
.task-table .row-actions{flex-wrap:nowrap;gap:6px}
.comment-cell{border:0;background:transparent;padding:0;text-align:left;cursor:pointer;font:inherit;position:relative;display:block}
.comment-cell:hover .clamp2,.comment-cell:focus-visible .clamp2{text-decoration:underline;text-decoration-color:#94a3b8;text-underline-offset:2px;color:#1f3557}
.cm-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.cm-info{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;font-size:11px;margin:0 0 14px}
.cm-info dt{color:#64748b}.cm-info dd{margin:0;color:#1f2937}
.cm-text{white-space:pre-wrap;font-size:12px;line-height:1.7;background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:10px 12px;color:#1f2937}
.cm-history{display:grid;gap:8px}
.cm-hist{border-left:3px solid #cbd5e1;padding:4px 10px;font-size:11px}
.cm-hist b{color:#1f3557;margin-right:8px}.cm-hist span{color:#64748b;font-size:10px}.cm-hist p{margin:4px 0 0;white-space:pre-wrap;color:#334155}
.cm-actions{margin-top:14px}

/* BUILD 7.2 — sao chép / dán giao việc */
.assign-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:-4px 0 2px}
.assign-tools small{font-size:10px;color:#475569}
.assign-tools .btn:disabled{opacity:.45}
.col-sel{width:34px;text-align:center;padding-left:8px!important;padding-right:4px!important}
.col-sel input{width:16px;height:16px;cursor:pointer;accent-color:#1d4ed8}
.task-table tr.row-selected td{background:#eff6ff}
.bulk-bar{position:sticky;top:90px;z-index:6;display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#1e3a8a;color:#fff;border-radius:10px;padding:9px 12px;margin-bottom:12px;box-shadow:0 8px 22px #1e3a8a33}
.bulk-bar small{color:#c7d2fe;font-size:10.5px}
.bulk-bar .btn{border-color:transparent}

.bulk-opt{display:block;padding:7px 0;font-size:12px}
.bulk-opt input{margin-right:6px}

/* BUILD 7.2 — báo cáo trạng thái dự án, lọc bổ sung */
.report-tabs{margin:-6px 0 16px}
.st-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-bottom:16px}

.st-prow{cursor:pointer;background:#f8fbff}.st-prow:hover td{background:#eef4ff}
.st-crow td{background:#fff}.st-indent{color:#94a3b8}
.drill{border:0;background:#eef4ff;color:#1d4ed8;font-weight:800;border-radius:6px;padding:3px 9px;cursor:pointer;font-size:11px;position:relative}
.drill:hover{background:#dbe7ff;text-decoration:underline}
.drill.c-early{color:#15803d;background:#ecfdf3}.drill.c-ontime{color:#166534;background:#f0fdf4}.drill.c-late{color:#b45309;background:#fffbeb}.drill.c-overdue{color:#b91c1c;background:#fef2f2}
b.c-overdue{color:#b91c1c}

/* BUILD 7.2 — kết quả thời hạn, popup chi tiết công việc */

.dlr-good{background:#dcfce7;color:#166534}.dlr-bad{background:#fee2e2;color:#b91c1c}.dlr-warn{background:#fef3c7;color:#92400e}.dlr-muted{background:#f1f5f9;color:#475569}

.modal.modal-wide{width:min(980px,100%)}

.td-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:12px;font-size:11px}

.td-result{margin-bottom:12px}
.pre{white-space:pre-wrap}
.td-actions{margin-top:16px;padding-top:12px;border-top:1px solid #e6ebf2;flex-wrap:wrap;gap:8px}

/* BUILD 7.2 — lịch làm việc, ngày nghỉ, báo cáo theo nhân viên */
