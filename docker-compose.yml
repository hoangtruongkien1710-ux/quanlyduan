services:
  db:
    image: postgres:16
    container_name: smee_qlda_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: smee
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: smee
    ports:
      - "5432:5432"
    volumes:
      - smee_qlda_pg:/var/lib/postgresql/data
volumes:
  smee_qlda_pg:
